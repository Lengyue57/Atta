name: geometry kernel

on:
  push:
    branches: [main, v1.3-beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install kernel and existing CAD test dependencies
        run: python -m pip install -e '.[all]'
      - name: Require the optional exact CAD backend
        run: python -c 'import build123d; import OCP'
      - name: Exercise surfaces, CAD, fields and module delivery
        env:
          ATTA_HOME: ${{ runner.temp }}/atta-kernel
        run: >-
          python -m pytest -o addopts='' -q
          tests/test_nurbs.py tests/test_cad_features.py
          tests/test_implicit_brep.py tests/test_module_assembly.py
          tests/test_fieldtree.py tests/test_field_budget.py
          tests/test_field_numeric_contract.py tests/test_geometry_provenance.py
          tests/test_assembly_acceptance.py tests/test_spec_acceptance.py
          tests/test_look_bridge.py
          tests/test_kernel_showcase.py
          tests/test_3d_metrics.py tests/test_verify_mutation.py
          tests/test_drawing_dxf.py tests/test_sketch_tags.py
          tests/test_graph_patch.py tests/test_engine_3d_drawing.py
          tests/test_docs_sync.py tests/test_install.py
